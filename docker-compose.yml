# LifeOS — local multi-app stack
#
# Usage:
#   cp .env.example .env        # fill in AUTH_SECRET + ANTHROPIC_API_KEY at minimum
#   docker compose up --build
#
# Subdomains (via Caddy on :80):
#   http://persons.localhost
#   http://stuff.localhost
#   http://places.localhost
#   http://home.localhost
#   http://events.localhost
#   http://assistant.localhost
#
# DB: all apps share the local Postgres service. Production uses Neon Postgres.

x-nextjs-build: &nextjs-build
  context: .
  dockerfile: docker/Dockerfile.nextjs

x-app-defaults: &app-defaults
  env_file:
    - path: .env
      required: false
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

volumes:
  life-os-pg:
  caddy-data:
  caddy-config:

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos
      POSTGRES_DB: lifeos
    ports:
      - "${LIFE_OS_POSTGRES_PORT:-5433}:5432"
    volumes:
      - life-os-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # ── Caddy reverse proxy ────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - persons
      - places
      - home
      - stuff
      - events
      - assistant
    restart: unless-stopped

  # ── App services ────────────────────────────────────────────────────────────
  persons:
    <<: *app-defaults
    build:
      <<: *nextjs-build
      args:
        APP_NAME: persons
        PORT: "3000"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://lifeos:lifeos@postgres:5432/lifeos

  stuff:
    <<: *app-defaults
    build:
      <<: *nextjs-build
      args:
        APP_NAME: stuff
        PORT: "3001"
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://lifeos:lifeos@postgres:5432/lifeos

  places:
    <<: *app-defaults
    build:
      <<: *nextjs-build
      args:
        APP_NAME: places
        PORT: "3002"
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://lifeos:lifeos@postgres:5432/lifeos

  home:
    <<: *app-defaults
    build:
      <<: *nextjs-build
      args:
        APP_NAME: home
        PORT: "3003"
    ports:
      - "3003:3003"
    environment:
      DATABASE_URL: postgresql://lifeos:lifeos@postgres:5432/lifeos
      NEXT_PUBLIC_PERSONS_URL: ${NEXT_PUBLIC_PERSONS_URL:-http://persons.localhost}
      NEXT_PUBLIC_STUFF_URL: ${NEXT_PUBLIC_STUFF_URL:-http://stuff.localhost}
      NEXT_PUBLIC_PLACES_URL: ${NEXT_PUBLIC_PLACES_URL:-http://places.localhost}
      NEXT_PUBLIC_EVENTS_URL: ${NEXT_PUBLIC_EVENTS_URL:-http://events.localhost}

  events:
    <<: *app-defaults
    build:
      <<: *nextjs-build
      args:
        APP_NAME: events
        PORT: "3006"
    ports:
      - "3006:3006"
    environment:
      DATABASE_URL: postgresql://lifeos:lifeos@postgres:5432/lifeos

  assistant:
    <<: *app-defaults
    build:
      <<: *nextjs-build
      args:
        APP_NAME: assistant
        PORT: "3005"
    ports:
      - "3005:3005"
    environment:
      DATABASE_URL: postgresql://lifeos:lifeos@postgres:5432/lifeos
