name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Fast feedback. The `check` job below installs Prisma, replays migrations and
  # runs a drill before it ever reaches lint, so a stray unused variable takes
  # minutes to surface. This job answers the cheap questions in about a minute
  # and runs in parallel.
  #
  # Production deploys only after both jobs succeed on a push to master.
  # Vercel git-push production is disabled (ignored build step); Hobby cannot
  # wait for GitHub checks, so Actions is the CD trigger.
  #
  # `npm run lint` is four gates chained with &&: eslint, the dependency
  # boundary check, the migration integrity check (every turso-migrate
  # script pairs with a committed migration, and the whole history replays into
  # an empty database), and the deploy-config check (no root vercel.json; cron
  # files present).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The migration check needs better-sqlite3, so a full install rather than
      # --omit=dev. eslint is not type-aware here, so no Prisma generate needed.
      - name: Install dependencies
        run: npm ci

      - name: Lint, boundaries, migration integrity, and deploy config
        run: npm run lint

  check:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: life-os-ci-only-secret
      # A literal path, not ${{ runner.temp }}. The `runner` context is only
      # available to steps; referencing it in job-level `env` is an invalid
      # context, which GitHub rejects when validating the workflow. The whole
      # run then fails in 0s with "workflow file issue" and no job ever starts —
      # which is what had been happening on every push since this env block
      # was introduced.
      DATABASE_URL: file:/tmp/life-os-ci.db
      NEXTAUTH_SECRET: life-os-ci-only-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm exec --workspace @life-os/db -- prisma validate

      - name: Generate Prisma client
        run: npm run generate -w @life-os/db

      - name: Check generated Prisma client is current
        run: git diff --exit-code -- packages/db/generated

      - name: Apply migrations to an empty database
        run: npm run migrate:deploy -w @life-os/db

      - name: Verify migration upgrade and restore
        run: npm run db:drill

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Critical-path E2E
        run: npm run e2e

      - name: Production build
        run: npm run build

      - name: Check performance and bundle budgets
        run: npm run perf:check:built

  deploy:
    name: Deploy production
    needs: [lint, check]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@59.1.3

      - name: Deploy affected apps
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npx tsx scripts/deploy.ts --ci --affected --before "${{ github.event.before }}"
