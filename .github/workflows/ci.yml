name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Fast feedback. The `check` job below installs Prisma, replays migrations and
  # runs a drill before it ever reaches lint, so a stray unused variable takes
  # minutes to surface. This job answers the cheap questions in about a minute
  # and runs in parallel.
  #
  # Production deploys only after both jobs succeed on a push to master.
  # Vercel git-push production is disabled (ignored build step); Hobby cannot
  # wait for GitHub checks, so Actions is the CD trigger.
  #
  # `npm run lint` is four gates chained with &&: eslint, the dependency
  # boundary check, the migration integrity check (the whole migration history
  # replays into an empty Postgres database), and the deploy-config check
  # (no root vercel.json; cron files present).
  lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: life_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/life_os_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # eslint is not type-aware here, so no Prisma generate needed. The
      # migration-integrity gate needs a Postgres server (the `postgres`
      # service above) to replay the history into.
      - name: Install dependencies
        run: npm ci

      - name: Lint, boundaries, migration integrity, and deploy config
        run: npm run lint

  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: life_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET: life-os-ci-only-secret
      # Postgres service on localhost:5432 (see `services` above). The test and
      # migration steps create their own throwaway databases on this server.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/life_os_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/life_os_ci
      NEXTAUTH_SECRET: life-os-ci-only-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm exec --workspace @life-os/db -- prisma validate

      - name: Generate Prisma client
        run: npm run generate -w @life-os/db

      - name: Apply migrations to an empty database
        run: npm run migrate:deploy -w @life-os/db

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Critical-path E2E
        run: npm run e2e

      - name: Production build
        run: npm run build

      - name: Check performance and bundle budgets
        run: npm run perf:check:built

  deploy:
    name: Deploy production
    needs: [lint, check]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@59.1.3

      - name: Deploy affected apps
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Direct (unpooled) Neon connection — scripts/deploy.ts runs
          # `prisma migrate status` against production before shipping.
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npx tsx scripts/deploy.ts --ci --affected --before "${{ github.event.before }}"
